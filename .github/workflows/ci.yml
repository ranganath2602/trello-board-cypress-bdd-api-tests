name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Gherkin lint
        run: npm run lint:feature

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run headless Cypress tests
        env:
          CYPRESS_TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          CYPRESS_TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: npm run cy:run:qa

      - name: Upload reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports
          path: |
            reports
            cypress/reports
